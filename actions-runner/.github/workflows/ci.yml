Use:
name: CloudNest CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show runner
        run: |
          echo "Running on self-hosted runner"
          hostname
          uname -a

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
